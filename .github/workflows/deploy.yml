name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'server_net/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      # 蓝绿零停机部署：
      # 1) 服务器拉取新代码并构建镜像（不打 tag，先不进生产）
      # 2) 在「空闲槽位」起新实例（5200 或 5201），另一个槽位继续服务
      # 3) 等新实例 healthy
      # 4) nginx -s reload 平滑切流（旧 worker 处理完存量请求才退出）
      # 5) 确认新实例稳定后停掉旧槽位
      #
      # 关键前提：两实例共享 PG / Redis / server/data，重复弹幕靠 message_id
      # 唯一索引去重，因此重叠期内双录是安全的。
      - name: Deploy on Server (blue-green, zero downtime)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          timeout: 300s
          script_stop: true
          script: |
            set -e
            TARGET_DIR="/opt/1panel/apps/danmu-tools"
            NGINX_CONTAINER="1Panel-openresty-pljd"
            PROXY_CONF_DIR="/www/sites/api.ovodm.top/proxy"
            COMMIT="${{ github.sha }}"
            echo "Deployed commit: $COMMIT"

            # ── 1. 拉取源码（codeload 直连，按 SHA 幂等）──
            rm -rf /tmp/danmu_deploy && mkdir -p /tmp/danmu_deploy
            curl -fsSL --retry 3 --retry-delay 5 --max-time 300 \
              "https://codeload.github.com/sfqy211/danmu_vue/tar.gz/$COMMIT" \
              -o /tmp/danmu_deploy/src.tar.gz
            tar -xzf /tmp/danmu_deploy/src.tar.gz -C /tmp/danmu_deploy --strip-components=1
            test -f /tmp/danmu_deploy/server_net/Danmu.Server.csproj || { echo "ERROR: 源码不完整"; exit 1; }
            echo "source downloaded"

            cd "$TARGET_DIR"
            rm -rf server_net.new && cp -a /tmp/danmu_deploy/server_net ./server_net.new
            rm -rf server_net && mv server_net.new server_net
            cp -f /tmp/danmu_deploy/Dockerfile ./Dockerfile
            cp -f /tmp/danmu_deploy/docker-compose.yml ./docker-compose.yml
            rm -rf /tmp/danmu_deploy
            echo "source updated"

            # ── 2. 确定当前在服务的是哪个槽位，新版本部署到另一个 ──
            info() { sudo docker inspect --format='{{.State.Health.Status}}' "$1" 2>/dev/null || echo "absent"; }

            BLUE_HEALTH=$(info danmu-viewer-blue)
            GREEN_HEALTH=$(info danmu-viewer-green)
            echo "current state: blue=$BLUE_HEALTH green=$GREEN_HEALTH"

            if [ "$BLUE_HEALTH" = "healthy" ] && [ "$GREEN_HEALTH" != "healthy" ]; then
              ACTIVE="blue";  TARGET="green";  TARGET_PORT=5201
            elif [ "$GREEN_HEALTH" = "healthy" ] && [ "$BLUE_HEALTH" != "healthy" ]; then
              ACTIVE="green"; TARGET="blue";   TARGET_PORT=5200
            elif [ "$BLUE_HEALTH" != "healthy" ] && [ "$GREEN_HEALTH" != "healthy" ]; then
              # 首次切换到蓝绿架构：老容器 danmu-viewer 可能在跑，先按单实例处理
              echo "no healthy blue/green instance; bootstrapping to blue"
              ACTIVE="none";  TARGET="blue";   TARGET_PORT=5200
            else
              # 两个都健康（异常状态）：保留 transport 更久的一个，另一个重建
              ACTIVE="both";  TARGET="green";  TARGET_PORT=5201
            fi
            echo "active=$ACTIVE target=$TARGET port=$TARGET_PORT"

            # ── 3. 构建新镜像 ──
            echo "Building image..."
            sudo docker-compose build

            # ── 4. 起新实例（此时旧实例仍在服务）──
            echo "Starting $TARGET instance..."
            sudo docker-compose up -d --no-deps "danmu-$TARGET"

            # ── 5. 等待新实例 healthy ──
            echo "Waiting for danmu-viewer-$TARGET to become healthy..."
            MAX_WAIT=180; WAITED=0
            while [ $WAITED -lt $MAX_WAIT ]; do
              H=$(info "danmu-viewer-$TARGET")
              if [ "$H" = "healthy" ]; then echo "healthy after ${WAITED}s"; break; fi
              sleep 3; WAITED=$((WAITED + 3))
            done
            if [ $WAITED -ge $MAX_WAIT ]; then
              echo "ERROR: new instance not healthy within ${MAX_WAIT}s, aborting (old instance still serving)"
              sudo docker logs --tail 40 "danmu-viewer-$TARGET" || true
              sudo docker stop "danmu-viewer-$TARGET" || true
              exit 1
            fi

            # 新实例直接探活（绕过 nginx）
            curl -fsS --max-time 10 "http://127.0.0.1:$TARGET_PORT/api/health" && echo "direct health ok"

            # ── 6. 写 nginx upstream：主节点指向新实例，旧实例降为 backup ──
            echo "Switching nginx upstream to $TARGET..."
            if [ "$TARGET" = "green" ]; then
              NEW_PRIMARY=5201; BACKUP=5200
            else
              NEW_PRIMARY=5200; BACKUP=5201
            fi

            # 先在宿主机生成配置文件，再 docker cp 进容器。
            # 不能用 `docker exec sh -c "cat > file" <<EOF`：docker exec 未带 -i 时
            # 不会把 stdin 传给容器，文件会被截断为空（曾导致全站 404）。
            # 生成两个文件：
            # 1) upstream 必须放 http 层（conf.d/*.conf 被 include 到 http 块内）
            # 2) location 放站点 proxy 目录（被 include 到 server 块内）
            # 写错位置会报 "upstream directive is not allowed here"。
            python3 - "$NEW_PRIMARY" "$BACKUP" > /tmp/danmu_upstream.conf <<'PYEOF'
            import sys
            primary, backup = sys.argv[1], sys.argv[2]
            print(f"""upstream danmu_backend {{
                server 127.0.0.1:{primary} max_fails=2 fail_timeout=10s;
                server 127.0.0.1:{backup} max_fails=2 fail_timeout=10s backup;
                keepalive 32;
            }}""")
            PYEOF

            cat > /tmp/danmu_root.conf <<'LOCEOF'
            location ^~ / {
                proxy_pass http://danmu_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 300s;
                proxy_next_upstream error timeout http_502 http_503 http_504;
                proxy_next_upstream_tries 2;
                proxy_next_upstream_timeout 10s;
                add_header X-Cache $upstream_cache_status;
                add_header Strict-Transport-Security "max-age=31536000";
            }
            LOCEOF
            # 去掉 heredoc 引入的行首缩进
            sed -i 's/^            //' /tmp/danmu_root.conf

            for f in /tmp/danmu_upstream.conf /tmp/danmu_root.conf; do
              if [ ! -s "$f" ]; then
                echo "ERROR: generated $f is empty, aborting (traffic not switched)"
                exit 1
              fi
              echo "generated $(basename $f): $(wc -c < $f) bytes"
            done

            sudo docker cp /tmp/danmu_upstream.conf "$NGINX_CONTAINER:/usr/local/openresty/nginx/conf/conf.d/danmu_upstream.conf"
            sudo docker cp /tmp/danmu_root.conf "$NGINX_CONTAINER:$PROXY_CONF_DIR/root.conf"
            rm -f /tmp/danmu_upstream.conf /tmp/danmu_root.conf

            # ── 7. 校验配置并平滑重载（不中断现有连接）──
            sudo docker exec "$NGINX_CONTAINER" nginx -t
            sudo docker exec "$NGINX_CONTAINER" nginx -s reload
            echo "nginx reloaded (graceful)"

            # ── 8. 通过 nginx 验证新版本已在服务 ──
            sleep 3
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 10 "http://127.0.0.1:5200/api/health" >/dev/null 2>&1 \
                 || curl -fsS --max-time 10 "http://127.0.0.1:5201/api/health" >/dev/null 2>&1; then
                echo "post-switch health check ok"; break
              fi
              sleep 3
            done

            # ── 9. 停掉旧实例（graceful：30s 内完成刷盘与会话收尾）──
            if [ "$ACTIVE" != "none" ] && [ "$ACTIVE" != "$TARGET" ] && [ "$ACTIVE" != "both" ]; then
              echo "Stopping old instance danmu-viewer-$ACTIVE..."
              sudo docker stop -t 30 "danmu-viewer-$ACTIVE" || true
            elif [ "$ACTIVE" = "both" ]; then
              OTHER=$([ "$TARGET" = "green" ] && echo blue || echo green)
              echo "Stopping other instance danmu-viewer-$OTHER..."
              sudo docker stop -t 30 "danmu-viewer-$OTHER" || true
            fi

            # ── 10. 清理历史遗留的单实例容器（首次迁移到蓝绿时）──
            if sudo docker ps -a --format '{{.Names}}' | grep -qx "danmu-viewer"; then
              echo "Removing legacy single-instance container..."
              sudo docker stop -t 30 danmu-viewer || true
              sudo docker rm danmu-viewer || true
            fi

            # ── 11. 收尾 ──
            sudo docker image prune -f
            echo "--- auth log ---"
            sudo docker logs --tail 20 "danmu-viewer-$TARGET" 2>&1 | grep -E "auth success|login auth|anonymous auth" || true
            echo "Blue-green deployment complete: active=$TARGET"
