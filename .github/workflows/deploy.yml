name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'server_net/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      # 2026-11-09 事故复盘：
      # 1) 服务器侧 git fetch 曾走 gh.jasonzeng.dev 代理 —— 该域名在服务器上已无法解析，
      #    且其分支 ref 缓存会把 master 长期钉在 2026-07 的旧提交，导致多次"部署成功"
      #    但生产实际未更新；
      # 2) scp-action 对目标服务器始终报 Process exited with status 1（权限与 SFTP 均正常）；
      # 3) 本文件曾以 CRLF 保存，脚本行尾 \r 也会破坏服务器端命令。
      # 现方案（已实测）：服务器直连 codeload 按 commit SHA 下载源码 → 覆盖 server_net /
      # Dockerfile / docker-compose.yml（.env 与 server/data 保留）→ docker-compose 构建重启。
      # 按 SHA 下载天然具备幂等性，不受任何 CDN/代理的分支缓存影响。
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          timeout: 300s
          script_stop: true
          script: |
            set -e
            TARGET_DIR="/opt/1panel/apps/danmu-tools"
            CONTAINER_NAME="danmu-viewer"
            COMMIT="${{ github.sha }}"
            echo "Deployed commit: $COMMIT"

            # 1) 按 commit SHA 下载源码（codeload 直连，绕开 git 与已失效的镜像代理）
            rm -rf /tmp/danmu_deploy && mkdir -p /tmp/danmu_deploy
            curl -fsSL --retry 3 --retry-delay 5 --max-time 300 \
              "https://codeload.github.com/sfqy211/danmu_vue/tar.gz/$COMMIT" \
              -o /tmp/danmu_deploy/src.tar.gz
            tar -xzf /tmp/danmu_deploy/src.tar.gz -C /tmp/danmu_deploy --strip-components=1
            test -f /tmp/danmu_deploy/server_net/Danmu.Server.csproj || { echo "ERROR: 源码下载不完整"; exit 1; }
            echo "source downloaded"

            # 2) 覆盖源码（保留 .env 与 server/data 数据目录）
            cd "$TARGET_DIR"
            rm -rf server_net.new && cp -a /tmp/danmu_deploy/server_net ./server_net.new
            rm -rf server_net && mv server_net.new server_net
            cp -f /tmp/danmu_deploy/Dockerfile ./Dockerfile
            cp -f /tmp/danmu_deploy/docker-compose.yml ./docker-compose.yml
            rm -rf /tmp/danmu_deploy
            echo "source updated"

            # 3) 构建并重启（compose 检测镜像变化后自动重建容器）
            echo "Building new image..."
            sudo docker-compose build

            echo "Starting new container..."
            sudo docker-compose up -d --no-deps

            # 4) 等待健康
            echo "Waiting for new container to become healthy..."
            MAX_WAIT=120
            WAITED=0
            while [ $WAITED -lt $MAX_WAIT ]; do
              HEALTH=$(sudo docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NAME 2>/dev/null || echo "none")
              if [ "$HEALTH" = "healthy" ]; then
                echo "New container is healthy after ${WAITED}s"
                break
              fi
              RUNNING=$(sudo docker inspect --format='{{.State.Running}}' $CONTAINER_NAME 2>/dev/null || echo "false")
              if [ "$RUNNING" = "true" ] && [ "$HEALTH" = "none" ]; then
                echo "No healthcheck configured, waiting 10s for app startup..."
                sleep 10
                break
              fi
              sleep 3
              WAITED=$((WAITED + 3))
            done

            if [ $WAITED -ge $MAX_WAIT ]; then
              echo "WARNING: container not healthy within ${MAX_WAIT}s"
            fi

            # 5) 校验部署结果（鉴权模式应从 anonymous 变回 login）
            echo "--- recent auth log ---"
            sudo docker logs "$CONTAINER_NAME" 2>&1 | grep -E "auth success|login auth|anonymous auth" | tail -5 || true

            sudo docker image prune -f
            echo "Blue-green deployment complete"
